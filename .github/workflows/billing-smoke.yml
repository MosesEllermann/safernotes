name: billing-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-billing-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production Creem configuration
        env:
          API_HOST: ${{ secrets.API_HOST }}
          API_PORT: ${{ secrets.API_PORT }}
          API_USER: ${{ secrets.API_USER }}
          API_SSH_KEY: ${{ secrets.API_SSH_KEY }}
          API_PROJECT_PATH: ${{ secrets.API_PROJECT_PATH }}
        run: |
          test -n "$API_HOST"
          test -n "$API_USER"
          test -n "$API_SSH_KEY"
          test -n "$API_PROJECT_PATH"

          mkdir -p ~/.ssh
          printf '%s\n' "$API_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key
          ssh-keyscan -p "${API_PORT:-22}" -H "$API_HOST" >> ~/.ssh/known_hosts

          BILLING_DIAG="$(cat <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings.production')

          import django

          django.setup()

          from django.conf import settings

          print(f'BILLING_PROVIDER={settings.BILLING_PROVIDER}')
          print(f'BILLING_API_BASE_URL={settings.BILLING_API_BASE_URL}')
          print(f'BILLING_API_KEY_SET={bool(settings.BILLING_API_KEY)}')
          print(f'BILLING_API_KEY_IS_TEST={settings.BILLING_API_KEY.startswith("creem_test_")}')
          print(f'BILLING_PRODUCT_PLANS={",".join(sorted(settings.BILLING_PRODUCT_IDS))}')
          print(f'BILLING_TESTER_EMAILS={",".join(settings.BILLING_TESTER_EMAILS)}')

          if settings.BILLING_PROVIDER != 'creem':
              raise SystemExit('Creem billing is not enabled')
          if not settings.BILLING_API_KEY:
              raise SystemExit('The Creem API key is missing')

          for plan, product_id in sorted(settings.BILLING_PRODUCT_IDS.items()):
              url = f'{settings.BILLING_API_BASE_URL.rstrip("/")}/products/{product_id}'
              request = Request(
                  url,
                  headers={'Accept': 'application/json', 'x-api-key': settings.BILLING_API_KEY},
              )
              try:
                  with urlopen(request, timeout=15) as api_response:
                      body = json.loads(api_response.read().decode('utf-8'))
                  print(
                      f'CREEM_PRODUCT_CHECK plan={plan} http={api_response.status} '
                      f'id_matches={body.get("id") == product_id} status={body.get("status")}'
                  )
              except HTTPError as exc:
                  try:
                      body = json.loads(exc.read().decode('utf-8'))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      body = {}
                  print(
                      f'CREEM_PRODUCT_CHECK plan={plan} http={exc.code} '
                      f'trace_id={body.get("trace_id", "<none>")} '
                      f'message={body.get("message", "<unavailable>")}'
                  )
                  raise SystemExit('Creem product validation failed') from exc
              except (URLError, TimeoutError) as exc:
                  print(f'CREEM_PRODUCT_CHECK plan={plan} unavailable={type(exc).__name__}')
                  raise SystemExit('Creem API is unavailable from the production container') from exc
          PY
          )"

          ssh -p "${API_PORT:-22}" -i ~/.ssh/api_deploy_key "$API_USER@$API_HOST" \
            "cd '$API_PROJECT_PATH' && docker compose --env-file /opt/safernotes/.env.production -f deploy/docker-compose.prod.yml exec -T api python -c $(printf '%q' "$BILLING_DIAG")"
