name: security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]" pip-audit bandit
      - run: pip-audit
      - run: |
          find apps config -name "*.py" \
            ! -name "tests.py" \
            ! -name "*_tests.py" \
            ! -path "*/migrations/*" \
            -print0 | xargs -0 bandit
