name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/check_source.py
      - run: python -m unittest discover -s tools -p 'test_*.py'

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --dart-define=API_BASE_URL=same-origin --no-wasm-dry-run

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/init_selfhost.py
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Check the single web endpoint and internal attachment storage
        run: |
          curl --fail --silent --show-error http://localhost:8080/ --output /dev/null
          curl --fail --silent --show-error http://localhost:8080/api/v1/health/live
          docker compose exec -T api python manage.py shell <<'PY'
          import uuid
          from apps.attachments.storage import configured_bucket, s3_client
          client = s3_client()
          key = 'ci-smoke/' + str(uuid.uuid4())
          try:
              client.put_object(Bucket=configured_bucket(), Key=key, Body=b'encrypted-test-data')
              obj = client.get_object(Bucket=configured_bucket(), Key=key)
              try:
                  assert obj['Body'].read() == b'encrypted-test-data'
              finally:
                  obj['Body'].close()
          finally:
              client.delete_object(Bucket=configured_bucket(), Key=key)
          print('Internal attachment storage round trip passed.')
          PY
      - name: Stop the disposable test stack
        if: always()
        run: docker compose down
