name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'frontend/**'
      - 'tools/prepare_android_signing.py'
      - 'tools/check_website.py'
      - 'tools/deploy_website.sh'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'frontend/**'
      - 'tools/prepare_android_signing.py'
      - 'tools/check_website.py'
      - 'tools/deploy_website.sh'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/check_source.py
      - run: python tools/check_website.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: bash -n tools/deploy_website.sh

  android-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare private release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: python3 ../tools/prepare_android_signing.py "$RUNNER_TEMP/safernotes-signing"
      - name: Build signed offline-first APK
        env:
          SAFERNOTES_SIGNING_PROPERTIES: ${{ runner.temp }}/safernotes-signing/key.properties
        run: flutter build apk --release --dart-define=API_BASE_URL=
      - name: Verify APK signature
        run: |
          build_tools_version="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$build_tools_version/apksigner" verify build/app/outputs/flutter-apk/app-release.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: safernotes-android-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove private signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/safernotes-signing/key.properties" "$RUNNER_TEMP/safernotes-signing/upload-keystore.jks"
          if [ -d "$RUNNER_TEMP/safernotes-signing" ]; then
            rmdir "$RUNNER_TEMP/safernotes-signing"
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, android-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://safernotes.com
    steps:
      - uses: actions/checkout@v7
      - name: Download signed APK from this run
        uses: actions/download-artifact@v7
        with:
          name: safernotes-android-${{ github.sha }}
          path: website/downloads
      - name: Prepare website download
        run: mv website/downloads/app-release.apk website/downloads/safernotes-android.apk
      - name: Upload static website to SPanel
        env:
          DEPLOY_ANDROID_APK: 'true'
          SPANEL_HOST: ${{ secrets.SPANEL_HOST }}
          SPANEL_PORT: ${{ secrets.SPANEL_PORT }}
          SPANEL_USER: ${{ secrets.SPANEL_USER }}
          SPANEL_SSH_KEY: ${{ secrets.SPANEL_SSH_KEY }}
          SPANEL_LANDING_PATH: ${{ secrets.SPANEL_LANDING_PATH }}
          SPANEL_KNOWN_HOSTS: ${{ secrets.SPANEL_KNOWN_HOSTS }}
        run: bash tools/deploy_website.sh
      - name: Verify published homepage and documentation
        run: |
          curl --fail --silent --show-error --retry 3 https://safernotes.com/ | grep -q 'docs.html'
          curl --fail --silent --show-error --retry 3 https://safernotes.com/docs.html | grep -q 'id="faq"'
          curl --fail --silent --show-error --retry 3 "https://safernotes.com/downloads/safernotes-android.apk?release=$GITHUB_SHA" -o "$RUNNER_TEMP/published.apk"
          cmp website/downloads/safernotes-android.apk "$RUNNER_TEMP/published.apk"
