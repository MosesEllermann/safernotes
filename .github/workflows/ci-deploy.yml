name: ci-and-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  API_BASE_URL: ${{ vars.SAFERNOTES_API_BASE_URL || 'https://api.safernotes.com' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safernotes
          POSTGRES_USER: safernotes
          POSTGRES_PASSWORD: safernotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safernotes -d safernotes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret
      DATABASE_URL: postgres://safernotes:safernotes@localhost:5432/safernotes
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      BILLING_WEBHOOK_SECRET: ci-billing-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Update Python package installer
        run: python -m pip install --upgrade "pip>=26.2"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply test migrations
        run: python manage.py migrate --noinput
      - name: Run backend tests
        run: pytest -q
      - name: Lint backend
        run: ruff check .

  python-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Update Python package installer
        run: python -m pip install --upgrade "pip>=26.2"
      - name: Install security tools
        run: pip install -e ".[dev]" pip-audit bandit
      - name: Audit Python dependencies
        run: pip-audit --skip-editable
      - name: Scan backend source
        if: ${{ always() }}
        run: |
          find apps config -name "*.py" \
            ! -name "tests.py" \
            ! -name "*_tests.py" \
            ! -path "*/migrations/*" \
            -print0 | xargs -0 bandit

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter client
        run: flutter analyze
      - name: Test Flutter client
        run: flutter test
      - name: Build Flutter web client
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL" --no-wasm-dry-run
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: safernotes-web-${{ github.sha }}
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 7

  android-release:
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Configure Android upload signing
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PROPERTIES_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES_BASE64 repository secrets are required."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build signed Android APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: safernotes-android-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing files
        if: ${{ always() }}
        run: rm -f android/key.properties android/app/upload-keystore.jks

  deploy-production:
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOY == 'true' }}
    needs:
      - backend-tests
      - python-security
      - frontend-build
      - android-release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.safernotes.com
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: safernotes-web-${{ github.sha }}
          path: frontend/build/web
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: safernotes-android-${{ github.sha }}
          path: website/downloads
      - name: Name Android download
        run: mv website/downloads/app-release.apk website/downloads/safernotes-android.apk

      - name: Install deploy tools
        run: |
          if command -v rsync >/dev/null && command -v ssh >/dev/null; then
            echo "rsync and ssh are already available."
            exit 0
          fi

          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y rsync openssh-client && exit 0
            echo "apt install failed on attempt $attempt; retrying..."
            sleep 10
          done

          exit 1

      - name: Configure production email environment
        env:
          API_HOST: ${{ secrets.API_HOST }}
          API_PORT: ${{ secrets.API_PORT }}
          API_USER: ${{ secrets.API_USER }}
          API_SSH_KEY: ${{ secrets.API_SSH_KEY }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
          PROTON_SMTP_USER: ${{ secrets.PROTON_SMTP_USER }}
        run: |
          if [ -z "$PROTON_SMTP_TOKEN" ]; then
            echo "::error::PROTON_SMTP_TOKEN secret is required for production email."
            exit 1
          fi
          PROTON_SMTP_USER="${PROTON_SMTP_USER:-noreply@safernotes.com}"

          mkdir -p ~/.ssh
          printf '%s\n' "$API_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key
          ssh-keyscan -p "${API_PORT:-22}" -H "$API_HOST" >> ~/.ssh/known_hosts

          ssh -p "${API_PORT:-22}" -i ~/.ssh/api_deploy_key "$API_USER@$API_HOST" \
            "PROTON_SMTP_TOKEN=$(printf '%q' "$PROTON_SMTP_TOKEN") PROTON_SMTP_USER=$(printf '%q' "$PROTON_SMTP_USER") bash -s" <<'REMOTE'
          set -Eeuo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          env_file = Path("/opt/safernotes/.env.production")
          if not env_file.exists():
              raise SystemExit(f"Missing production env file: {env_file}")

          updates = {
              "EMAIL_BACKEND": "django.core.mail.backends.smtp.EmailBackend",
              "EMAIL_HOST": "smtp.protonmail.ch",
              "EMAIL_PORT": "587",
              "EMAIL_HOST_USER": os.environ["PROTON_SMTP_USER"],
              "EMAIL_HOST_PASSWORD": os.environ["PROTON_SMTP_TOKEN"],
              "EMAIL_USE_TLS": "True",
              "EMAIL_USE_SSL": "False",
              "DEFAULT_FROM_EMAIL": f"Safernotes <{os.environ['PROTON_SMTP_USER']}>",
          }

          lines = env_file.read_text().splitlines()
          seen = set()
          next_lines = []
          for line in lines:
              key = line.split("=", 1)[0] if "=" in line else ""
              if key in updates:
                  next_lines.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  next_lines.append(line)

          for key, value in updates.items():
              if key not in seen:
                  next_lines.append(f"{key}={value}")

          env_file.write_text("\n".join(next_lines) + "\n")
          print("Production email environment updated.")
          PY
          REMOTE

      - name: Deploy static sites to SPanel
        env:
          SPANEL_HOST: ${{ secrets.SPANEL_HOST }}
          SPANEL_PORT: ${{ secrets.SPANEL_PORT }}
          SPANEL_USER: ${{ secrets.SPANEL_USER }}
          SPANEL_SSH_KEY: ${{ secrets.SPANEL_SSH_KEY }}
          SPANEL_LANDING_PATH: ${{ secrets.SPANEL_LANDING_PATH }}
          SPANEL_APP_PATH: ${{ secrets.SPANEL_APP_PATH }}
        run: |
          test -n "$SPANEL_HOST"
          test -n "$SPANEL_USER"
          test -n "$SPANEL_SSH_KEY"
          test -n "$SPANEL_LANDING_PATH"
          test -n "$SPANEL_APP_PATH"

          mkdir -p ~/.ssh
          printf '%s\n' "$SPANEL_SSH_KEY" > ~/.ssh/spanel_deploy_key
          chmod 600 ~/.ssh/spanel_deploy_key
          ssh-keyscan -p "${SPANEL_PORT:-22}" -H "$SPANEL_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete --exclude '.htaccess' --exclude '.well-known/' -e "ssh -p ${SPANEL_PORT:-22} -i ~/.ssh/spanel_deploy_key" website/ "$SPANEL_USER@$SPANEL_HOST:$SPANEL_LANDING_PATH/"
          rsync -az --delete --exclude '.htaccess' --exclude '.well-known/' -e "ssh -p ${SPANEL_PORT:-22} -i ~/.ssh/spanel_deploy_key" frontend/build/web/ "$SPANEL_USER@$SPANEL_HOST:$SPANEL_APP_PATH/"
          ssh -p "${SPANEL_PORT:-22}" -i ~/.ssh/spanel_deploy_key "$SPANEL_USER@$SPANEL_HOST" "mkdir -p '$SPANEL_APP_PATH/.well-known'"
          rsync -az -e "ssh -p ${SPANEL_PORT:-22} -i ~/.ssh/spanel_deploy_key" frontend/web/.well-known/assetlinks.json "$SPANEL_USER@$SPANEL_HOST:$SPANEL_APP_PATH/.well-known/assetlinks.json"

      - name: Deploy backend to Ubuntu host
        env:
          API_HOST: ${{ secrets.API_HOST }}
          API_PORT: ${{ secrets.API_PORT }}
          API_USER: ${{ secrets.API_USER }}
          API_SSH_KEY: ${{ secrets.API_SSH_KEY }}
          API_PROJECT_PATH: ${{ secrets.API_PROJECT_PATH }}
        run: |
          test -n "$API_HOST"
          test -n "$API_USER"
          test -n "$API_SSH_KEY"
          test -n "$API_PROJECT_PATH"

          mkdir -p ~/.ssh
          printf '%s\n' "$API_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key
          ssh-keyscan -p "${API_PORT:-22}" -H "$API_HOST" >> ~/.ssh/known_hosts

          ssh -p "${API_PORT:-22}" -i ~/.ssh/api_deploy_key "$API_USER@$API_HOST" \
            "cd '$API_PROJECT_PATH' && git fetch origin main && git checkout --detach '$GITHUB_SHA' && bash deploy/scripts/deploy_backend.sh '$API_PROJECT_PATH' '$GITHUB_SHA'"

      - name: Verify production email configuration
        env:
          API_HOST: ${{ secrets.API_HOST }}
          API_PORT: ${{ secrets.API_PORT }}
          API_USER: ${{ secrets.API_USER }}
          API_SSH_KEY: ${{ secrets.API_SSH_KEY }}
          API_PROJECT_PATH: ${{ secrets.API_PROJECT_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$API_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key
          ssh-keyscan -p "${API_PORT:-22}" -H "$API_HOST" >> ~/.ssh/known_hosts

          EMAIL_DIAG="$(cat <<'PY'
          import os

          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings.production')

          import django

          django.setup()

          from django.conf import settings
          from django.core import mail

          print(f'EMAIL_BACKEND={settings.EMAIL_BACKEND}')
          print(f'EMAIL_HOST={settings.EMAIL_HOST or "<empty>"}')
          print(f'EMAIL_PORT={settings.EMAIL_PORT}')
          print(f'EMAIL_HOST_USER_SET={bool(settings.EMAIL_HOST_USER)}')
          print(f'EMAIL_HOST_PASSWORD_SET={bool(settings.EMAIL_HOST_PASSWORD)}')
          print(f'EMAIL_USE_TLS={settings.EMAIL_USE_TLS}')
          print(f'EMAIL_USE_SSL={settings.EMAIL_USE_SSL}')
          print(f'DEFAULT_FROM_EMAIL={settings.DEFAULT_FROM_EMAIL}')

          if settings.EMAIL_BACKEND != 'django.core.mail.backends.smtp.EmailBackend':
              raise SystemExit(f'EMAIL_BACKEND must be SMTP in production, got {settings.EMAIL_BACKEND}')
          if not settings.EMAIL_HOST:
              raise SystemExit('EMAIL_HOST is not set')
          if not settings.EMAIL_HOST_USER:
              raise SystemExit('EMAIL_HOST_USER is not set')
          if not settings.EMAIL_HOST_PASSWORD:
              raise SystemExit('EMAIL_HOST_PASSWORD is not set')
          if not (settings.EMAIL_USE_TLS or settings.EMAIL_USE_SSL):
              raise SystemExit('EMAIL_USE_TLS or EMAIL_USE_SSL must be enabled')

          connection = mail.get_connection(timeout=15)
          connection.open()
          connection.close()
          print('SMTP_OPEN_OK=true')
          PY
          )"

          ssh -p "${API_PORT:-22}" -i ~/.ssh/api_deploy_key "$API_USER@$API_HOST" \
            "cd '$API_PROJECT_PATH' && docker compose --env-file /opt/safernotes/.env.production -f deploy/docker-compose.prod.yml run --rm api python -c $(printf '%q' "$EMAIL_DIAG")"

      - name: Verify production API
        run: curl -fsS "$API_BASE_URL/api/v1/health/live"

      - name: Verify production website downloads
        run: |
          curl -fsS https://safernotes.com/ | grep -q 'Safernotes'
          curl -fsS https://safernotes.com/downloads.html | grep -q 'Downloads'
          curl -fsSI https://safernotes.com/downloads/safernotes-android.apk
          curl -fsS https://app.safernotes.com/.well-known/assetlinks.json | grep -q 'at.ecrumedia.safernotes'

  deploy-disabled:
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOY != 'true' }}
    needs:
      - backend-tests
      - python-security
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production deploy is disabled by ENABLE_PRODUCTION_DEPLOY."
