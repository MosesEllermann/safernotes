name: deploy-production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  API_BASE_URL: ${{ vars.SAFERNOTES_API_BASE_URL || 'https://api.safernotes.com' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safernotes
          POSTGRES_USER: safernotes
          POSTGRES_PASSWORD: safernotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safernotes -d safernotes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret
      DATABASE_URL: postgres://safernotes:safernotes@localhost:5432/safernotes
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,api.safernotes.com
      CORS_ALLOWED_ORIGINS: http://localhost:3000,https://app.safernotes.com
      BILLING_WEBHOOK_SECRET: ci-billing-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Check backend
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          pytest -q
          ruff check .

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Check and build Flutter web
        working-directory: frontend
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL" --no-wasm-dry-run

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Deploy static sites to SPanel
        if: ${{ vars.ENABLE_PRODUCTION_DEPLOY == 'true' }}
        env:
          SPANEL_HOST: ${{ secrets.SPANEL_HOST }}
          SPANEL_PORT: ${{ secrets.SPANEL_PORT }}
          SPANEL_USER: ${{ secrets.SPANEL_USER }}
          SPANEL_SSH_KEY: ${{ secrets.SPANEL_SSH_KEY }}
          SPANEL_LANDING_PATH: ${{ secrets.SPANEL_LANDING_PATH }}
          SPANEL_APP_PATH: ${{ secrets.SPANEL_APP_PATH }}
        run: |
          test -n "$SPANEL_HOST"
          test -n "$SPANEL_USER"
          test -n "$SPANEL_SSH_KEY"
          test -n "$SPANEL_LANDING_PATH"
          test -n "$SPANEL_APP_PATH"

          mkdir -p ~/.ssh
          printf '%s\n' "$SPANEL_SSH_KEY" > ~/.ssh/spanel_deploy_key
          chmod 600 ~/.ssh/spanel_deploy_key
          ssh-keyscan -p "${SPANEL_PORT:-22}" -H "$SPANEL_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete --exclude '.htaccess' --exclude '.well-known/' -e "ssh -p ${SPANEL_PORT:-22} -i ~/.ssh/spanel_deploy_key" website/ "$SPANEL_USER@$SPANEL_HOST:$SPANEL_LANDING_PATH/"
          rsync -az --delete --exclude '.htaccess' --exclude '.well-known/' -e "ssh -p ${SPANEL_PORT:-22} -i ~/.ssh/spanel_deploy_key" frontend/build/web/ "$SPANEL_USER@$SPANEL_HOST:$SPANEL_APP_PATH/"

      - name: Deploy backend to Ubuntu host
        if: ${{ vars.ENABLE_PRODUCTION_DEPLOY == 'true' }}
        env:
          API_HOST: ${{ secrets.API_HOST }}
          API_PORT: ${{ secrets.API_PORT }}
          API_USER: ${{ secrets.API_USER }}
          API_SSH_KEY: ${{ secrets.API_SSH_KEY }}
          API_PROJECT_PATH: ${{ secrets.API_PROJECT_PATH }}
        run: |
          test -n "$API_HOST"
          test -n "$API_USER"
          test -n "$API_SSH_KEY"
          test -n "$API_PROJECT_PATH"

          mkdir -p ~/.ssh
          printf '%s\n' "$API_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key
          ssh-keyscan -p "${API_PORT:-22}" -H "$API_HOST" >> ~/.ssh/known_hosts

          ssh -p "${API_PORT:-22}" -i ~/.ssh/api_deploy_key "$API_USER@$API_HOST" \
            "cd '$API_PROJECT_PATH' && bash deploy/scripts/deploy_backend.sh '$API_PROJECT_PATH'"

      - name: Verify production API
        if: ${{ vars.ENABLE_PRODUCTION_DEPLOY == 'true' }}
        run: |
          curl -fsS "$API_BASE_URL/api/v1/health/live"

      - name: Skip production deploy until configured
        if: ${{ vars.ENABLE_PRODUCTION_DEPLOY != 'true' }}
        run: |
          echo "Production deploy is disabled. Set repository variable ENABLE_PRODUCTION_DEPLOY=true after DNS, servers, and secrets are configured."
