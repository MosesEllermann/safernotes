apiVersion: apps/v1
kind: Deployment
metadata:
  name: safernotes-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safernotes-api
  template:
    metadata:
      labels:
        app: safernotes-api
    spec:
      containers:
        - name: api
          image: safernotes-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: safernotes-api-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/search/status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

