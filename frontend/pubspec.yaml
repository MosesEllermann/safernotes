name: zknotes_app
description: Zero-knowledge notes client for web, Android, and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  uuid: ^4.5.1
  lucide_icons_flutter: ^3.1.14+2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  hashlib: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

