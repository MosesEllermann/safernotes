name: safernotes_app
description: Zero-knowledge notes client for web, Android, and iOS.
publish_to: "none"
version: 0.1.5+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  uuid: ^4.5.1
  phosphor_icons: ^3.0.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  hashlib: ^2.3.4
  flutter_quill: ^11.5.1
  dynamic_color: ^2.1.0
  cupertino_native_better: ^1.5.4
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Keep the native image decoders in-tree until the upstream plugins expose
# bounded decoding. This prevents Play's full-resolution BitmapFactory warning
# from regressing when lockfiles are refreshed.
dependency_overrides:
  flutter_local_notifications:
    path: third_party/flutter_local_notifications
  quill_native_bridge_android:
    path: third_party/quill_native_bridge_android

flutter:
  uses-material-design: true
  assets:
    - assets/safernotes-logo-black.png
    - assets/safernotes-logo-white.png
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Variable.ttf
