map $http_x_forwarded_proto $external_scheme {
  default $scheme;
  https https;
}

log_format without_query '$remote_addr - $request_method $uri $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;
  access_log /var/log/nginx/access.log without_query;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
