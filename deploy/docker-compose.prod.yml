services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    env_file:
      - ${SAFERNOTES_ENV_FILE:-/opt/safernotes/.env.production}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAFERNOTES_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    env_file:
      - ${SAFERNOTES_ENV_FILE:-/opt/safernotes/.env.production}
    restart: unless-stopped
    volumes:
      - ${SAFERNOTES_DATA_DIR:-/opt/safernotes/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - ${SAFERNOTES_DATA_DIR:-/opt/safernotes/data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
