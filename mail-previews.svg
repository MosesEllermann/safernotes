<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1584" viewBox="0 0 1500 1584">
<rect x="0" y="0" width="1500" height="1584" rx="0" fill="#eef2f7"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;dominant-baseline:auto}</style>
<text x="36" y="64" font-size="34" font-weight="800" fill="#0f172a">Safernotes E-Mail Previews</text>
<text x="36" y="94" font-size="17" font-weight="400" fill="#64748b">Schlichte Vorschau mit Beispiel-Daten, Deutsch und Englisch.</text>
<rect x="36" y="132" width="702" height="460" rx="16" fill="#ffffff" stroke="#dbe4ef" stroke-width="1"/><rect x="36" y="132" width="702" height="82" rx="16" fill="#f8fafc"/><rect x="36" y="198" width="702" height="16" rx="0" fill="#f8fafc"/><line x1="36" y1="214" x2="738" y2="214" stroke="#e2e8f0"/><rect x="54" y="148" width="90" height="26" rx="13" fill="#e2e8f0"/><text x="66" y="166" font-size="12" font-weight="800" fill="#334155" letter-spacing=".04em">DEUTSCH</text><text x="54" y="196" font-size="15" font-weight="700" fill="#0f172a">Betreff: Dein Safernotes Bestätigungscode</text><rect x="36" y="214" width="702" height="378" rx="0" fill="#f8fafc"/><rect x="78" y="242" width="618" height="260" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="110" y="272" font-size="14" font-weight="700" fill="#64748b" letter-spacing=".04em">E-MAIL-BESTÄTIGUNG</text><text x="110" y="306" font-size="28" font-weight="750" fill="#0f172a">Dein Bestätigungscode</text><text x="110" y="346" font-size="16" font-weight="400" fill="#334155">Gib diesen sechsstelligen Code in Safernotes ein, um deine</text><text x="110" y="371" font-size="16" font-weight="400" fill="#334155">E-Mail-Adresse zu bestätigen.</text><text x="110" y="408" font-size="13" font-weight="400" fill="#64748b">Bestätigungscode</text><text x="110" y="440" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="9px">7 4 2 9 1 8</text><text x="110" y="476" font-size="13" font-weight="400" fill="#64748b">Der Code läuft in 30 Minuten ab. Wenn du dieses Konto nicht</text><text x="110" y="496" font-size="13" font-weight="400" fill="#64748b">erstellt hast, kannst du diese E-Mail ignorieren.</text><text x="355.0" y="538" font-size="12" font-weight="400" fill="#94a3b8">Safernotes</text>
<rect x="762" y="132" width="702" height="460" rx="16" fill="#ffffff" stroke="#dbe4ef" stroke-width="1"/><rect x="762" y="132" width="702" height="82" rx="16" fill="#f8fafc"/><rect x="762" y="198" width="702" height="16" rx="0" fill="#f8fafc"/><line x1="762" y1="214" x2="1464" y2="214" stroke="#e2e8f0"/><rect x="780" y="148" width="82" height="26" rx="13" fill="#e2e8f0"/><text x="792" y="166" font-size="12" font-weight="800" fill="#334155" letter-spacing=".04em">ENGLISH</text><text x="780" y="196" font-size="15" font-weight="700" fill="#0f172a">Betreff: Your Safernotes verification code</text><rect x="762" y="214" width="702" height="378" rx="0" fill="#f8fafc"/><rect x="804" y="242" width="618" height="260" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="836" y="272" font-size="14" font-weight="700" fill="#64748b" letter-spacing=".04em">EMAIL VERIFICATION</text><text x="836" y="306" font-size="28" font-weight="750" fill="#0f172a">Your verification code</text><text x="836" y="346" font-size="16" font-weight="400" fill="#334155">Enter this six-digit code in Safernotes to confirm your email</text><text x="836" y="371" font-size="16" font-weight="400" fill="#334155">address.</text><text x="836" y="408" font-size="13" font-weight="400" fill="#64748b">Verification code</text><text x="836" y="440" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="9px">7 4 2 9 1 8</text><text x="836" y="476" font-size="13" font-weight="400" fill="#64748b">The code expires in 30 minutes. If you did not create this</text><text x="836" y="496" font-size="13" font-weight="400" fill="#64748b">account, you can ignore this email.</text><text x="1081.0" y="538" font-size="12" font-weight="400" fill="#94a3b8">Safernotes</text>
<rect x="36" y="616" width="702" height="460" rx="16" fill="#ffffff" stroke="#dbe4ef" stroke-width="1"/><rect x="36" y="616" width="702" height="82" rx="16" fill="#f8fafc"/><rect x="36" y="682" width="702" height="16" rx="0" fill="#f8fafc"/><line x1="36" y1="698" x2="738" y2="698" stroke="#e2e8f0"/><rect x="54" y="632" width="90" height="26" rx="13" fill="#e2e8f0"/><text x="66" y="650" font-size="12" font-weight="800" fill="#334155" letter-spacing=".04em">DEUTSCH</text><text x="54" y="680" font-size="15" font-weight="700" fill="#0f172a">Betreff: Dein Safernotes Code zum Zurücksetzen des Passworts</text><rect x="36" y="698" width="702" height="378" rx="0" fill="#f8fafc"/><rect x="78" y="726" width="618" height="260" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="110" y="756" font-size="14" font-weight="700" fill="#64748b" letter-spacing=".04em">PASSWORTRESET</text><text x="110" y="790" font-size="28" font-weight="750" fill="#0f172a">Passwort zurücksetzen</text><text x="110" y="830" font-size="16" font-weight="400" fill="#334155">Verwende diesen sechsstelligen Code zusammen mit deinem</text><text x="110" y="855" font-size="16" font-weight="400" fill="#334155">Recovery-Key, um dein Safernotes Passwort zurückzusetzen.</text><text x="110" y="892" font-size="13" font-weight="400" fill="#64748b">Wiederherstellungscode</text><text x="110" y="924" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="9px">3 8 6 2 0 4</text><text x="110" y="960" font-size="13" font-weight="400" fill="#64748b">Der Code läuft in 15 Minuten ab. Wenn du keinen Reset angefordert</text><text x="110" y="980" font-size="13" font-weight="400" fill="#64748b">hast, kannst du diese E-Mail ignorieren.</text><text x="355.0" y="1022" font-size="12" font-weight="400" fill="#94a3b8">Safernotes</text>
<rect x="762" y="616" width="702" height="460" rx="16" fill="#ffffff" stroke="#dbe4ef" stroke-width="1"/><rect x="762" y="616" width="702" height="82" rx="16" fill="#f8fafc"/><rect x="762" y="682" width="702" height="16" rx="0" fill="#f8fafc"/><line x1="762" y1="698" x2="1464" y2="698" stroke="#e2e8f0"/><rect x="780" y="632" width="82" height="26" rx="13" fill="#e2e8f0"/><text x="792" y="650" font-size="12" font-weight="800" fill="#334155" letter-spacing=".04em">ENGLISH</text><text x="780" y="680" font-size="15" font-weight="700" fill="#0f172a">Betreff: Your Safernotes password reset code</text><rect x="762" y="698" width="702" height="378" rx="0" fill="#f8fafc"/><rect x="804" y="726" width="618" height="260" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="836" y="756" font-size="14" font-weight="700" fill="#64748b" letter-spacing=".04em">PASSWORD RESET</text><text x="836" y="790" font-size="28" font-weight="750" fill="#0f172a">Reset your password</text><text x="836" y="830" font-size="16" font-weight="400" fill="#334155">Use this six-digit code together with your recovery key to reset</text><text x="836" y="855" font-size="16" font-weight="400" fill="#334155">your Safernotes password.</text><text x="836" y="892" font-size="13" font-weight="400" fill="#64748b">Recovery code</text><text x="836" y="924" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="9px">3 8 6 2 0 4</text><text x="836" y="960" font-size="13" font-weight="400" fill="#64748b">The code expires in 15 minutes. If you did not request a reset,</text><text x="836" y="980" font-size="13" font-weight="400" fill="#64748b">you can ignore this email.</text><text x="1081.0" y="1022" font-size="12" font-weight="400" fill="#94a3b8">Safernotes</text>
<rect x="36" y="1100" width="702" height="460" rx="16" fill="#ffffff" stroke="#dbe4ef" stroke-width="1"/><rect x="36" y="1100" width="702" height="82" rx="16" fill="#f8fafc"/><rect x="36" y="1166" width="702" height="16" rx="0" fill="#f8fafc"/><line x1="36" y1="1182" x2="738" y2="1182" stroke="#e2e8f0"/><rect x="54" y="1116" width="90" height="26" rx="13" fill="#e2e8f0"/><text x="66" y="1134" font-size="12" font-weight="800" fill="#334155" letter-spacing=".04em">DEUTSCH</text><text x="54" y="1164" font-size="15" font-weight="700" fill="#0f172a">Betreff: anna@example.com hat dich eingeladen, eine Notiz zu bearbeiten</text><rect x="36" y="1182" width="702" height="378" rx="0" fill="#f8fafc"/><rect x="78" y="1210" width="618" height="260" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="110" y="1240" font-size="14" font-weight="700" fill="#64748b" letter-spacing=".04em">GETEILTE NOTIZ</text><text x="110" y="1274" font-size="28" font-weight="750" fill="#0f172a">anna@example.com hat dich eingeladen</text><text x="110" y="1314" font-size="16" font-weight="400" fill="#334155">Öffne Safernotes, um die Einladung anzusehen und die geteilte</text><text x="110" y="1339" font-size="16" font-weight="400" fill="#334155">Notiz gemeinsam zu bearbeiten.</text><rect x="110" y="1386" width="170" height="44" rx="10" fill="#0f172a"/><text x="128" y="1414" font-size="15" font-weight="700" fill="#ffffff">Safernotes öffnen</text><text x="110" y="1452" font-size="13" font-weight="400" fill="#64748b">Zum Schutz deiner Privatsphäre werden Notizinhalte nicht per</text><text x="110" y="1472" font-size="13" font-weight="400" fill="#64748b">E-Mail angezeigt.</text><text x="355.0" y="1506" font-size="12" font-weight="400" fill="#94a3b8">Safernotes</text>
<rect x="762" y="1100" width="702" height="460" rx="16" fill="#ffffff" stroke="#dbe4ef" stroke-width="1"/><rect x="762" y="1100" width="702" height="82" rx="16" fill="#f8fafc"/><rect x="762" y="1166" width="702" height="16" rx="0" fill="#f8fafc"/><line x1="762" y1="1182" x2="1464" y2="1182" stroke="#e2e8f0"/><rect x="780" y="1116" width="82" height="26" rx="13" fill="#e2e8f0"/><text x="792" y="1134" font-size="12" font-weight="800" fill="#334155" letter-spacing=".04em">ENGLISH</text><text x="780" y="1164" font-size="15" font-weight="700" fill="#0f172a">Betreff: anna@example.com invited you to edit a note</text><rect x="762" y="1182" width="702" height="378" rx="0" fill="#f8fafc"/><rect x="804" y="1210" width="618" height="260" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="836" y="1240" font-size="14" font-weight="700" fill="#64748b" letter-spacing=".04em">SHARED NOTE</text><text x="836" y="1274" font-size="28" font-weight="750" fill="#0f172a">anna@example.com invited you to collaborate</text><text x="836" y="1314" font-size="16" font-weight="400" fill="#334155">You can now open Safernotes to review the invitation and edit the</text><text x="836" y="1339" font-size="16" font-weight="400" fill="#334155">shared note.</text><rect x="836" y="1386" width="150" height="44" rx="10" fill="#0f172a"/><text x="854" y="1414" font-size="15" font-weight="700" fill="#ffffff">Open Safernotes</text><text x="836" y="1452" font-size="13" font-weight="400" fill="#64748b">For your privacy, note contents are not shown in email.</text><text x="1081.0" y="1506" font-size="12" font-weight="400" fill="#94a3b8">Safernotes</text>
</svg>