[project]
name = "safernotes-backend"
version = "0.1.0"
description = "Zero-knowledge SaaS notes backend"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.0,<5.3",
  "djangorestframework>=3.17.2,<3.18",
  "channels>=4.1,<4.3",
  "channels-redis>=4.2,<4.4",
  "psycopg[binary]>=3.1,<3.3",
  "django-cors-headers>=4.3,<4.8",
  "django-environ>=0.11,<0.13",
  "argon2-cffi>=23.1,<26",
  "celery>=5.4,<5.6",
  "boto3>=1.34,<1.40",
  "gunicorn>=22,<24",
  "uvicorn[standard]>=0.30,<0.36",
  "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-django>=4.8,<5",
  "ruff>=0.5,<0.13",
  "mypy>=1.10,<1.17",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py", "tests.py", "*tests.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["*/migrations/*", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
